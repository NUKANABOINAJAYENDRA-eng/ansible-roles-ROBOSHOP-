- name: Install catalogue component
  hosts: catalogue
  become: yes
  tasks:
  - name: setup NPM source
    tags:
    - installation
    ansible.builtin.shell: "curl -sL https://rpm.nodesource.com/setup_lts.x | bash"


  - name: install Nodejs
    tags:
    - installation
    ansible.builtin.yum:
     name: nodejs
     state: present


  - name: check roboshop user exist or not
    tags:
    - installation
    ansible.builtin.command: id roboshop
    register: out #output is a variable name
    ignore_errors: true


  - when: out.rc != 0
    tags:
    - installation
    name: create user roboshop
    become: yes #we need sudo access for this task only
    ansible.builtin.user:
     name: roboshop

  - name: check /app directory exist or not
    tags:
    - installation
    ansible.builtin.stat:
     path: /app
    register: directory

  - name: print the directory stats
    tags:
    - installation
    ansible.builtin.debug:
     msg: "output: {{directory}}"



#write this only when directory.stat.exist == 'Flase' othere wise don't use this
#  - when: directory.stat.exist == Flase
 #   name: create /app directory
  #  ansible.builtin.file:
   #  path: /app
    # state: directory
  
  
  - name: install unzip
    tags:
    - installation
    ansible.builtin.yum:
     name: unzip
     state: present

  - name: download catalogue artifact
    tags:
    - deployment
    ansible.builtin.get_url:
     url: https://roboshop-builds.s3.amazonaws.com/catalogue.zip
     dest: /tmp

  
  - name: extract catalogue artifact
    tags:
    - deployment
    ansible.builtin.unarchive:
     src: /tmp/catalogue.zip
     dest: /app
     remote_src: yes

  - name: install dependencies
    tags:
    - deployment
    ansible.builtin.command: npm install
    args: 
     chdir: /app

  - name: copy catalogue service
    tags:
    - installation
    ansible.builtin.copy:
     src: catalogue.service
     dest: /etc/yum.repos.d/mongo.repo

  - name: demon reload
    tags:
    - installation
    ansible.builtin.systemd:
     demon_reload: true

  - name: copy mongoDB repo file
    tags:
    - installation
    ansible.builtin.copy:
     src: mongodb.repos
     dest: /etc/yum.repos.d/mongodb-org-7.0.repo

  - name: Install MongoDB
    tags:
    - installation
    ansible.builtin.yum:
     name: mongod-org-shell
     state: installed

  - name: load catalogue data
    tags:
    - installation
    ansible.builtin.command: mongo --host MONGODB-SERVER-IPADDRESS </app/schema/catalogue.js


  - name: restart catalogue
    tags:
    - deployment
    ansible.builtin.service:
     name: catalogue
     state: restarted
     enabled: true